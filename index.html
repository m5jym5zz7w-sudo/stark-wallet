<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STARK Wallet</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #02040a;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;
}

.stars {
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(circle, white 1px, transparent 1px);
    background-size: 80px 80px;
    opacity: .35;
    pointer-events: none;
}

.container {
    width: min(400px, 90%);
    text-align: center;
    position: relative;
}

.logo {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 6px;
    margin-bottom: 8px;
}

.subtitle {
    color: #69748b;
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 35px;
}

.card {
    padding: 30px 22px;
    border-radius: 25px;

    background: rgba(12, 16, 27, .9);
    border: 1px solid rgba(255,255,255,.08);

    box-shadow:
        0 25px 80px rgba(0,0,0,.5);
}

.status {
    color: #62e3a0;
    font-size: 13px;
    margin-bottom: 20px;
}

h1 {
    font-size: 24px;
    margin: 0 0 10px;
}

p {
    color: #747e93;
    font-size: 13px;
    line-height: 1.5;
}

button {
    width: 100%;
    height: 54px;

    margin-top: 20px;

    border: 0;
    border-radius: 15px;

    background: linear-gradient(
        135deg,
        #4b7fff,
        #2455e8
    );

    color: white;

    font-size: 15px;
    font-weight: 800;
}

#result {
    margin-top: 20px;
    color: #62e3a0;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">

    <div class="logo">
        STARK
    </div>

    <div class="subtitle">
        WALLET · MINI APP
    </div>

    <div class="card">

        <div class="status">
            ● SYSTEM READY
        </div>

        <h1>
            STARK Wallet
        </h1>

        <p>
            Первый тест Telegram Mini App.
        </p>

        <button id="testButton">
            Проверить Mini App
        </button>

        <div id="result"></div>

    </div>

</div>

<script>

document
    .getElementById("testButton")
    .addEventListener("click", function() {

        document
            .getElementById("result")
            .textContent =
            "✓ Mini App работает";

    });

</script>

</body>
</html>
